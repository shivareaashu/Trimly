<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Section Library - Trimly</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&amp;family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {
                    colors: {
                        "outline": "#7f7663",
                        "on-primary-fixed": "#241a00",
                        "on-surface-variant": "#4d4635",
                        "surface": "#fcf9f8",
                        "inverse-on-surface": "#f3f0ef",
                        "surface-dim": "#dcd9d9",
                        "tertiary-container": "#b3b3af",
                        "surface-variant": "#e5e2e1",
                        "surface-container-highest": "#e5e2e1",
                        "primary-fixed-dim": "#e9c349",
                        "tertiary": "#5e5f5c",
                        "on-secondary-fixed-variant": "#464744",
                        "on-secondary-fixed": "#1b1c19",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#eae7e7",
                        "surface-container-low": "#f6f3f2",
                        "on-tertiary-container": "#444543",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#735c00",
                        "background": "#fcf9f8",
                        "primary-container": "#d4af37",
                        "inverse-surface": "#313030",
                        "inverse-primary": "#e9c349",
                        "primary": "#735c00",
                        "secondary-fixed-dim": "#c7c7c2",
                        "tertiary-fixed": "#e3e2de",
                        "secondary": "#5e5f5b",
                        "tertiary-fixed-dim": "#c7c6c3",
                        "on-tertiary-fixed-variant": "#464744",
                        "on-secondary-container": "#646561",
                        "on-tertiary-fixed": "#1b1c1a",
                        "on-surface": "#1c1b1b",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#e3e3de",
                        "error": "#ba1a1a",
                        "on-primary-container": "#554300",
                        "outline-variant": "#d0c5af",
                        "error-container": "#ffdad6",
                        "surface-container": "#f0eded",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffe088",
                        "on-background": "#1c1b1b",
                        "surface-bright": "#fcf9f8",
                        "secondary-container": "#e3e3de",

                        "surface-container-lowest": "#ffffff"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        gutter: "24px",
                        unit: "8px",
                        "container-max": "1440px",
                        "margin-mobile": "20px",
                        "margin-desktop": "64px"
                    },
                    fontFamily: {
                        "label-md": ["Hanken Grotesk"],
                        "headline-lg": ["Bodoni Moda"],
                        "headline-lg-mobile": ["Bodoni Moda"],
                        "display-lg": ["Bodoni Moda"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Bodoni Moda"],
                        "body-md": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"]

                    fontSize: {

                }
            }
        };

<style>
        .drawer-shadow {
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.05);
        }
        .component-card-hover {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .component-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            border-color: #d0c5af;
        }
        .overlay-action {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }
        .component-card-hover:hover .overlay-action {
            opacity: 1;
            transform: translateY(0);
        }
        /* Custom Scrollbar for Drawer */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fcf9f8; 
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e2e1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #dcd9d9; 
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md antialiased overflow-hidden flex h-screen">
<!-- Main Builder Canvas (Background Mockup) -->
<main class="flex-1 bg-surface-container-low h-full p-8 md:p-margin-desktop flex flex-col transition-all duration-500 relative">
<div class="flex-1 border border-outline-variant/30 rounded-xl bg-surface flex flex-col items-center justify-center text-on-surface-variant relative overflow-hidden shadow-sm">
<div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #7f7663 1px, transparent 0); background-size: 32px 32px;"></div>
<span class="material-symbols-outlined text-6xl mb-4 text-tertiary-container" style="font-variation-settings: 'FILL' 0;">web</span>
<h2 class="font-headline-md text-headline-md mb-2">Builder Canvas</h2>
<p class="font-body-md text-body-md max-w-md text-center">Select a component from the library to add it to your page.</p>
</div>
</main>
<!-- Section Library Drawer -->
<aside class="w-full md:w-[480px] lg:w-[600px] h-full bg-surface drawer-shadow flex flex-col z-20 border-l border-outline-variant/20 relative transform transition-transform duration-500 translate-x-0">
<!-- Drawer Header -->
<header class="flex-none px-8 py-6 border-b border-outline-variant/30 bg-surface/90 backdrop-blur-md sticky top-0 z-10">
<div class="flex items-center justify-between mb-6">
<div>
<h1 class="font-headline-md text-headline-md text-primary">Section Library</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Curated components for your atelier.</p>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-variant/50 transition-colors text-on-surface-variant group">
<span class="material-symbols-outlined group-hover:rotate-90 transition-transform duration-300">close</span>
</button>
</div>
<!-- Search -->
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-tertiary">search</span>
<input class="w-full bg-transparent border-b border-outline-variant/50 py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary-container transition-colors placeholder:text-tertiary-container" placeholder="Search components..." type="text"/>
</div>
<!-- Categories -->
<div class="flex gap-2 overflow-x-auto mt-6 pb-2 no-scrollbar hide-scroll">
<button class="px-4 py-1.5 rounded-full bg-primary-container text-on-primary-container font-label-sm text-label-sm whitespace-nowrap transition-colors">All</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant/30 font-label-sm text-label-sm whitespace-nowrap transition-colors">Hero</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant/30 font-label-sm text-label-sm whitespace-nowrap transition-colors">Services</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant/30 font-label-sm text-label-sm whitespace-nowrap transition-colors">Gallery</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant/30 font-label-sm text-label-sm whitespace-nowrap transition-colors">Team</button>
<button class="px-4 py-1.5 rounded-full border border-outline-variant/50 text-on-surface-variant hover:bg-surface-variant/30 font-label-sm text-label-sm whitespace-nowrap transition-colors">Reviews</button>
</div>
</header>
<!-- Components Grid -->
<div class="flex-1 overflow-y-auto p-8 bg-surface-container-lowest">
<div class="grid grid-cols-1 gap-8">
<!-- Component Card 1 -->
<div class="group relative bg-surface border border-outline-variant/30 rounded-lg overflow-hidden component-card-hover cursor-pointer">
<div class="aspect-[16/9] w-full bg-surface-container-low relative overflow-hidden">
<!-- Simulated Mockup Image -->
<img alt="Minimalist salon interior hero section" class="w-full h-full object-cover opacity-80" data-alt="A pristine, sun-drenched minimalist salon interior serving as a hero section mockup. Soft ivory tones dominate the palette, accented by subtle gold fixtures and vast amounts of negative space. The high-key lighting creates a serene, luxurious atmosphere. Modern, high-end furniture is sparsely arranged, emphasizing a quiet luxury aesthetic." src="https://lh3.googleusercontent.com/aida/AP1WRLuNBV7ptFQ8cqr4lnQZpu6Lt_gon_fRYQTVGw6YPo13Rq1bdAfSIT4w0JwpkGn575qeOd_2AVq7FCl_rxQPRAVTuGvx5Oz7KvAZ4UxMicDXKzLssW6WL8gb_xQc0vNVLEDjSMXowjRoMsrXtxaHmio1Kd1o_fezA5RQdIDazAixJwKhR3k_xsikqtzZVgSMLT_uo-7VH1Zon_NcNVOiMu5NdR9ESqEP18s_H9de9_FZjei4Cpk8q3bIrQ2B"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface/80 to-transparent"></div>
<!-- Hover Action Overlay -->
<div class="absolute inset-0 bg-on-surface/5 flex items-center justify-center overlay-action backdrop-blur-[2px]">
<button class="bg-primary-container text-on-primary-container px-6 py-3 font-label-md text-label-md rounded shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span> Add to Page
                            </button>
</div>
</div>
<div class="p-4 flex items-center justify-between border-t border-outline-variant/20">
<div>
<h3 class="font-label-md text-label-md text-on-surface">Hero Split Image</h3>
<p class="font-label-sm text-label-sm text-tertiary mt-1">Hero</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">arrow_outward</span>
</div>
</div>
<!-- Component Card 2 -->
<div class="group relative bg-surface border border-outline-variant/30 rounded-lg overflow-hidden component-card-hover cursor-pointer">
<div class="aspect-[16/9] w-full bg-surface-container-low relative overflow-hidden p-6 flex flex-col justify-center items-center">
<!-- Abstract representation of a service grid -->
<div class="grid grid-cols-3 gap-3 w-full h-full opacity-60">
<div class="bg-surface-variant/50 border border-outline-variant/30 rounded h-full"></div>
<div class="bg-surface-variant/50 border border-outline-variant/30 rounded h-full"></div>
<div class="bg-surface-variant/50 border border-outline-variant/30 rounded h-full"></div>
</div>
<!-- Hover Action Overlay -->
<div class="absolute inset-0 bg-on-surface/5 flex items-center justify-center overlay-action backdrop-blur-[2px]">
<button class="bg-primary-container text-on-primary-container px-6 py-3 font-label-md text-label-md rounded shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">add</span> Add to Page
                            </button>
</div>
</div>
<div class="p-4 flex items-center justify-between border-t border-outline-variant/20">
<div>
<h3 class="font-label-md text-label-md text-on-surface">Service Bento Grid</h3>
<p class="font-label-sm text-label-sm text-tertiary mt-1">Services</p>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors">arrow_outward</span>
</div>
</div>
</div>
</div>
</aside>
</body></html>
